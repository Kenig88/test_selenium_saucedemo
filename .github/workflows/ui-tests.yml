name: UI Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - negative
          - e2e

      workers:
        description: "xdist workers count"
        required: true
        default: "2"
        type: choice
        options:
          - auto
          - "2"
          - "3"
          - "4"

# GitHub Pages публикует только один отчёт одновременно.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-tests:
    name: Run UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      BASE_URL: https://www.saucedemo.com/
      PYTEST_WORKERS: ${{ github.event.inputs.workers }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      SECRET_SAUCE: ${{ secrets.SECRET_SAUCE }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker compose build

      - name: Run selected test suite
        id: tests
        continue-on-error: true
        run: >-
          docker compose run --rm
          -e PYTEST_WORKERS=${{ github.event.inputs.workers }}
          ${{ github.event.inputs.suite }}

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R $USER:$USER allure-results logs || true

      - name: Add Allure metadata
        if: always()
        run: |
          mkdir -p allure-results

          jq -n \
            --arg report_name "UI Tests: ${{ github.event.inputs.suite }}" \
            --arg build_name "${{ github.workflow }} #${{ github.run_number }}" \
            --arg build_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson build_order "${{ github.run_number }}" \
            '{
              name: "GitHub Actions",
              type: "github",
              reportName: $report_name,
              buildOrder: $build_order,
              buildName: $build_name,
              buildUrl: $build_url
            }' > allure-results/executor.json

          printf '%s\n' \
            "Test_suite=${{ github.event.inputs.suite }}" \
            "Workers=${{ github.event.inputs.workers }}" \
            "Runner_OS=${{ runner.os }}" \
            "Browser=Chromium" \
            "Docker=true" \
            > allure-results/environment.properties

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Install Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Allure CLI
        if: always()
        uses: actions/cache@v6
        with:
          path: /opt/allure
          key: allure-2.38.1

      - name: Install Allure CLI
        if: always()
        run: |
          if [ ! -x /opt/allure/bin/allure ]; then
            ALLURE_VERSION=2.38.1
            curl -fL -o allure.tgz \
              "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
            tar -xzf allure.tgz
            sudo mv "allure-${ALLURE_VERSION}" /opt/allure
          fi

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Fetch Allure history branch
        if: always()
        run: git fetch --depth=1 origin allure-history:allure-history || true

      - name: Restore Allure history
        if: always()
        run: |
          if git show-ref --verify --quiet refs/heads/allure-history; then
            if git archive \
              --format=tar \
              --output=/tmp/allure-history.tar \
              allure-history history; then
              tar -xf /tmp/allure-history.tar -C /tmp
              mkdir -p allure-results/history
              cp -r /tmp/history/. allure-results/history/
            fi
          fi

      - name: Generate Allure reports
        id: report
        if: always()
        run: |
          allure generate allure-results -o allure-report-history --clean
          allure generate allure-results -o allure-report --clean --single-file
          touch allure-report/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Persist Allure history
        if: steps.report.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout --orphan tmp-history
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p history
          cp -r allure-report-history/history/. history/

          git add -f history
          git commit -m "Update Allure history"
          git branch -M allure-history
          git push -f origin allure-history

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
